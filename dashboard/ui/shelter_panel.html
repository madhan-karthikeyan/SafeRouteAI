<!DOCTYPE html>
<html>
<head><title>SafeRouteAI - Shelter Status</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; color: #e0e0e0; font-family: monospace; padding: 20px; }
h1 { color: #fff; font-size: 24px; margin-bottom: 20px; }
.shelter-active {
    background: #ff4444; color: #fff; padding: 20px; border-radius: 12px;
    text-align: center; font-size: 28px; font-weight: bold;
    animation: strobe 0.5s infinite;
}
.shelter-none {
    background: #1a3a2e; color: #00ff88; padding: 20px; border-radius: 12px;
    text-align: center; font-size: 20px;
}
@keyframes strobe { 0%,100% { background: #ff4444; color: #000; } 50% { background: #000; color: #ff4444; } }
.info { margin-top: 20px; color: #888; font-size: 13px; }
</style></head>
<body>
<h1><i class="fas fa-shield-alt"></i> Shelter-in-Place Status</h1>
<div id="shelter-status">Checking...</div>
<div class="info">Shelter-in-Place activates when ALL paths to every exit require crossing a flame-blocked edge.</div>
<script>
function updateShelter() {
    fetch('/evac/api/nodes').then(r => r.json()).then(function(data) {
        var shelterNodes = [];
        for (var id in data) {
            if (data[id].cost > 50000) shelterNodes.push(id);
        }
        var div = document.getElementById('shelter-status');
        if (shelterNodes.length > 0) {
            div.className = 'shelter-active';
            div.innerHTML = '⚠ SHELTER-IN-PLACE — NO SAFE EGRESS ⚠<br><span style="font-size:16px">Nodes affected: ' + shelterNodes.join(', ') + '</span>';
        } else {
            div.className = 'shelter-none';
            div.innerHTML = '✓ All nodes have a safe egress path';
        }
    }).catch(function() {
        document.getElementById('shelter-status').innerHTML = 'Cannot reach server';
    });
}
setInterval(updateShelter, 1000);
updateShelter();
</script>
</body>
</html>
