<!DOCTYPE html>
<html>
<head>
<title>SafeRouteAI - Floor Grid</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; color: #e0e0e0; font-family: monospace; padding: 20px; }
h1 { color: #00ff88; font-size: 24px; margin-bottom: 20px; }
.floor-section { background: #1a1a2e; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
.floor-title { color: #e0e0e0; font-size: 18px; margin-bottom: 16px; }
.node-grid { display: flex; gap: 16px; flex-wrap: wrap; }
.node-card {
    background: #16213e; border: 2px solid #0f3460; border-radius: 10px;
    padding: 16px; min-width: 160px; text-align: center; transition: all 0.3s;
}
.node-card.safe { border-color: #00ff88; }
.node-card.warning { border-color: #ffd700; }
.node-card.danger { border-color: #ff4444; animation: pulse 1s infinite; }
.node-card.shelter { border-color: #ffffff; animation: strobe 0.5s infinite; }
.node-card.exit { background: #1a3a2e; }
.node-id { color: #fff; font-weight: bold; font-size: 20px; }
.node-temp { color: #ff6b6b; font-size: 14px; margin-top: 4px; }
.node-smoke { color: #ffd93d; font-size: 14px; }
.node-flame { color: #ff4444; font-size: 14px; }
.node-cost { color: #6bcbff; font-size: 14px; }
.node-status { color: #aaa; font-size: 12px; margin-top: 4px; }
.exit-badge { background: #00ff88; color: #000; border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: bold; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
@keyframes strobe { 0%,100% { background: #fff; color: #000; } 50% { background: #333; color: #fff; } }
.legend { display: flex; gap: 20px; margin-bottom: 20px; }
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.legend-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid; }
.legend-dot.green { border-color: #00ff88; background: rgba(0,255,136,0.2); }
.legend-dot.yellow { border-color: #ffd700; background: rgba(255,215,0,0.2); }
.legend-dot.red { border-color: #ff4444; background: rgba(255,68,68,0.2); }
.legend-dot.white { border-color: #fff; background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<h1><i class="fas fa-map-marked-alt"></i> SafeRouteAI - Floor Overview</h1>
<div class="legend">
<div class="legend-item"><span class="legend-dot green"></span> Safe Path</div>
<div class="legend-item"><span class="legend-dot yellow"></span> Smoke Alternate</div>
<div class="legend-item"><span class="legend-dot red"></span> Danger / Flame</div>
<div class="legend-item"><span class="legend-dot white"></span> Shelter-in-Place</div>
</div>
<div class="floor-section" id="floor-0">
<div class="floor-title"><i class="fas fa-building"></i> Floor 0</div>
<div class="node-grid" id="grid-0">Loading...</div>
</div>
<div class="floor-section" id="floor-1" style="display:none">
<div class="floor-title"><i class="fas fa-building"></i> Floor 1</div>
<div class="node-grid" id="grid-1">No data</div>
</div>
<script>
function updateGrid() {
    fetch('/evac/api/nodes').then(r => r.json()).then(function(data) {
        for (var f = 0; f <= 1; f++) {
            var grid = document.getElementById('grid-' + f);
            if (!grid) continue;
            var html = '';
            for (var id in data) {
                var n = data[id];
                if (n.floor !== undefined && n.floor !== f) continue;
                var cls = 'node-card';
                if (n.flame) cls += ' danger';
                else if (n.cost > 50000) cls += ' shelter';
                else if (n.cost > 10000) cls += ' warning';
                else cls += ' safe';
                if (n.is_exit) cls += ' exit';
                html += '<div class="' + cls + '">';
                html += '<div class="node-id">Node ' + id + (n.is_exit ? ' <span class="exit-badge">EXIT</span>' : '') + '</div>';
                html += '<div class="node-temp"><i class="fas fa-temperature-high"></i> ' + (n.temp || '--') + '°C</div>';
                html += '<div class="node-smoke"><i class="fas fa-smog"></i> ' + (n.smoke || '0') + ' ppm</div>';
                if (n.flame) html += '<div class="node-flame"><i class="fas fa-fire"></i> FLAME</div>';
                html += '<div class="node-cost">Cost: ' + (n.cost ? Number(n.cost).toFixed(0) : '0') + '</div>';
                html += '</div>';
            }
            grid.innerHTML = html || '<div style="color:#666">No nodes on this floor</div>';
        }
    }).catch(function() {});
}
setInterval(updateGrid, 1000);
updateGrid();
</script>
</body>
</html>
